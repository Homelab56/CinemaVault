name: Build and Release CinemaVault Plugin

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [ main, develop ]

env:
  PLUGIN_NAME: CinemaVault
  PLUGIN_VERSION: 1.0.0.0
  TARGET_ABI: 10.11.0.0

jobs:
  build:
    name: Build Plugin
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build plugin
      run: dotnet build -c Release --no-restore
      
    - name: Create release directory
      run: |
        mkdir -p release
        mkdir -p release/Configuration
        
    - name: Copy plugin files
      run: |
        cp -r bin/Release/net9.0/* release/
        cp Configuration/configPage.html release/Configuration/
        cp -r Web release/
        
    - name: Create plugin zip
      run: |
        cd release
        zip -r ../${{ env.PLUGIN_NAME }}_${{ env.PLUGIN_VERSION }}.zip .
        cd ..
        
    - name: Calculate MD5 checksum
      run: |
        echo "CHECKSUM=$(md5sum ${PLUGIN_NAME}_${PLUGIN_VERSION}.zip | cut -d' ' -f1)" >> $GITHUB_ENV
        echo "Checksum calculated: $CHECKSUM"
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: plugin-build
        path: |
          ${{ env.PLUGIN_NAME }}_${{ env.PLUGIN_VERSION }}.zip
          *.md5
        retention-days: 30

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: plugin-build
        
    - name: Extract checksum
      run: |
        echo "CHECKSUM=$(cat *.md5)" >> $GITHUB_ENV
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ${{ env.PLUGIN_NAME }}_${{ env.PLUGIN_VERSION }}.zip
        tag_name: ${{ github.ref_name }}
        name: CinemaVault ${{ github.ref_name }}
        body: |
          ## CinemaVault ${{ github.ref_name }}
          
          🎬 Netflix-style UI for Jellyfin with Seerr integration
          
          ### Features
          - Hero banner with rotating featured content
          - Horizontal scrolling carousels (Netflix-style)
          - Seerr/Jellyseerr integration for content discovery and requests
          - Radarr/Sonarr integration for download management
          - Real-time request status tracking
          - Personal watchlist management
          - Responsive design with mobile support
          - Dark theme with customizable accent colors
          
          ### Installation
          1. Download the zip file below
          2. Extract to your Jellyfin plugins directory
          3. Restart Jellyfin
          4. Configure in Dashboard → Plugins → CinemaVault
          
          ### Changelog
          - Initial release with complete feature set
          - Hero banner with auto-rotation
          - Full Seerr integration
          - Request management system
          - Watchlist functionality
          - Netflix-style UI components
          
          ### Requirements
          - Jellyfin 10.11.x
          - .NET 9 runtime
          - Seerr/Jellyseerr instance
          - Radarr (optional, for movies)
          - Sonarr (optional, for TV shows)
          
          ---
          **MD5 Checksum:** ${{ env.CHECKSUM }}
        draft: false
        prerelease: false
        
    - name: Update manifest.json
      run: |
        # Update manifest.json with new checksum
        sed -i 's/"checksum": "[^"]*"/"checksum": "${{ env.CHECKSUM }}"/g' manifest.json
        
        # Commit updated manifest
        git config --local user.name "github-actions[bot]"
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git add manifest.json
        git diff --staged --quiet || exit 0  # Exit if no changes
        git commit -m "Update manifest.json checksum for ${{ github.ref_name }}"
        git push
